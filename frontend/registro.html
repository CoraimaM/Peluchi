<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta — Peluchi 🧸</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-layout">
    <div class="form-card">
      <h1>Crea tu cuenta 🧸</h1>
      <p class="sub">Únete a la familia Peluchi y guarda tus pedidos favoritos.</p>

      <div id="aviso"></div>

      <button class="btn-github mb-2" id="btn-github" type="button">
        <span style="font-size:1.2rem">🐙</span> Registrarme con GitHub
      </button>

      <div class="divisor">o con tu email</div>

      <form id="registro-form" novalidate>
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Ana García" required maxlength="120" />
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required
                 minlength="6" autocomplete="new-password" />
          <div class="campo-hint">Usa al menos 6 caracteres.</div>
        </div>
        <div class="campo">
          <label for="password2">Repite la contraseña</label>
          <input type="password" id="password2" placeholder="••••••••" required autocomplete="new-password" />
        </div>
        <button class="btn btn-ancho" type="submit" id="btn-crear">Crear cuenta</button>
      </form>

      <div class="form-enlace">
        ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/static/js/registro.js"></script>
</body>
</html>
