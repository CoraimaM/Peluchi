<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Peluchi 🧸</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="auth-layout">
    <div class="form-card">
      <h1>¡Bienvenido de nuevo! 👋</h1>
      <p class="sub">Inicia sesión para acceder a tu cuenta, carrito y pedidos.</p>

      <div id="aviso"></div>

      <button class="btn-github mb-2" id="btn-github" type="button">
        <span style="font-size:1.2rem">🐙</span> Continuar con GitHub
      </button>

      <div class="divisor">o con tu email</div>

      <form id="login-form" novalidate>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button class="btn btn-ancho" type="submit" id="btn-entrar">Entrar</button>
      </form>

      <div class="form-enlace">
        ¿Aún no tienes cuenta? <a href="/registro.html">Créala gratis</a>
      </div>

      <div class="aviso mt-2" style="background:var(--pastel-azul);border-color:#c9e4ff;color:#1565c0">
        💡 <strong>Demo:</strong> admin@peluchi.es / admin1234 · cliente@peluchi.es / cliente123
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/static/js/login.js"></script>
</body>
</html>
