# Blueprint de Render para Peluchi API
# https://render.com/docs/blueprints
#
# En el dashboard: New → Blueprint → selecciona este repositorio → Apply

databases:
  - name: peluchi-db
    plan: free

services:
  - type: web
    name: peluchi-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peluchi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@peluchi.es
      # Render pedirá este valor durante la sincronización inicial del Blueprint.
      # Déjalo en blanco para usar la contraseña documentada (admin1234).
      - key: ADMIN_PASSWORD
        sync: false
